
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LostIT | Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/Styles.css">
</head>
<body>

    <!-- NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="publicaciones.html">LostIT</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="publicaciones.html">Publicaciones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="solicitudes.html">Solicitudes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="perfil.html">Mi perfil</a>
                    </li>
                    <li class="nav-item" id="adminLink" hidden>
                        <a class="nav-link" href="admin.html">Administración</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <span class="navbar-text text-white" id="userNameNav"></span>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-outline-light btn-sm" href="login.html" id="logoutButton">
                            Cerrar sesión
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="mb-4">
            <h1 class="h2 fw-bold">Solicitudes</h1>
            <p class="text-muted">Consulta y administra tus solicitudes de recuperación.</p>
        </div>

        <!-- PESTAÑAS -->
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" type="button" id="sentTab"
                        data-request-tab="sent" role="tab"
                        aria-controls="sentRequestsSection" aria-selected="true">
                    Enviadas
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button class="nav-link" type="button" id="receivedTab"
                        data-request-tab="received" role="tab"
                        aria-controls="receivedRequestsSection" aria-selected="false">
                    Recibidas
                </button>
            </li>
        </ul>

        <!-- SOLICITUDES ENVIADAS -->
        <section id="sentRequestsSection" data-request-section="sent">
            <h2 class="h4 mb-3">Solicitudes que has enviado</h2>

            <div id="sentRequestsContainer" class="row g-3">
                <!-- El controlador carga aquí las solicitudes -->
            </div>

            <div id="sentRequestsEmpty" class="alert alert-info d-none">
                No has enviado solicitudes.
            </div>
        </section>

        <!-- SOLICITUDES RECIBIDAS -->
        <section id="receivedRequestsSection" data-request-section="received" hidden>
            <h2 class="h4 mb-3">Solicitudes que has recibido</h2>

            <div id="receivedRequestsContainer" class="row g-3">
                <!-- El controlador carga aquí las solicitudes -->
            </div>

            <div id="receivedRequestsEmpty" class="alert alert-info d-none">
                No has recibido solicitudes.
            </div>
        </section>

        <div id="requestsError" class="alert alert-danger d-none" role="alert"></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- CARGANDO: animación de Lottie mientras se llama al servidor (env.js la enseña y la quita) -->
    <div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
         background-color: rgba(255, 255, 255, 0.7); z-index: 2000; align-items: center; justify-content: center;">
        <lottie-player id="loading" src="https://lottie.host/55e35e3e-5400-4e7e-b599-9326b3637a37/ntcX2poqtH.json"
            background="transparent" speed="1" style="width: 200px; height: 200px;" loop autoplay></lottie-player>
    </div>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="../Controllers/env.js"></script>
    <script src="../Controllers/solicitudes.js"></script>
</body>
</html>
