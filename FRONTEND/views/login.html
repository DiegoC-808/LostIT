
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LostIT | Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/Styles.css">
</head>
<body class="bg-light">

    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card shadow border-0 rounded-4 w-100" style="max-width: 450px;">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <h1 class="fw-bold">LostIT</h1>
                    <p class="text-muted">Encuentra lo que perdiste</p>
                </div>

                <!-- INICIO DE SESIÓN -->
                <section id="loginSection">
                    <h2 class="h4 text-center mb-4">Iniciar sesión</h2>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="loginEmail"
                                   name="email" required autocomplete="email">
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="loginPassword"
                                   name="password" required autocomplete="current-password">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Recordarme
                                </label>
                            </div>
                        </div>

                        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

                        <button type="submit" class="btn btn-primary w-100" id="loginButton">
                            Iniciar sesión
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        ¿No tienes cuenta?
                        <a href="#" id="showRegister">Regístrate aquí</a>
                    </p>
                </section>

                <!-- REGISTRO -->
                <section id="registerSection" hidden>
                    <h2 class="h4 text-center mb-4">Crear una cuenta</h2>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerName" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="registerName"
                                   name="name" required minlength="3" autocomplete="name">
                        </div>

                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="registerEmail"
                                   name="email" required autocomplete="email">
                        </div>

                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="registerPassword"
                                   name="password" required minlength="8"
                                   autocomplete="new-password">
                            <div class="form-text">Mínimo 8 caracteres.</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmPassword"
                                   name="confirmPassword" required minlength="8"
                                   autocomplete="new-password">
                        </div>

                        <div id="registerError" class="alert alert-danger d-none" role="alert"></div>

                        <button type="submit" class="btn btn-primary w-100" id="registerButton">
                            Crear cuenta
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        ¿Ya tienes cuenta?
                        <a href="#" id="showLogin">Inicia sesión aquí</a>
                    </p>
                </section>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <!-- CARGANDO: animación de Lottie mientras se llama al servidor (env.js la enseña y la quita) -->
    <div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
         background-color: rgba(255, 255, 255, 0.7); z-index: 2000; align-items: center; justify-content: center;">
        <lottie-player id="loading" src="https://lottie.host/55e35e3e-5400-4e7e-b599-9326b3637a37/ntcX2poqtH.json"
            background="transparent" speed="1" style="width: 200px; height: 200px;" loop autoplay></lottie-player>
    </div>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="../Controllers/env.js"></script>
    <script src="../Controllers/auth.js"></script>
</body>
</html>
