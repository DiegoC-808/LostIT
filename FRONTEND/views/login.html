
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LostIT | Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="container py-4">
    <h2 class="fw-bold">LostIT</h2>
    <p class="text-muted">Comunidad universitaria</p>
</header>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm p-4">

                <!-- LOGIN -->
                <section id="loginSection">
                    <h1 class="h3 text-center">Bienvenido a LostIT</h1>
                    <p class="text-center text-muted">Inicia sesión para continuar</p>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Correo electrónico</label>
                            <input type="email" id="loginEmail" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Contraseña</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                        </div>

                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input type="checkbox" id="rememberMe" class="form-check-input">
                                <label for="rememberMe" class="form-check-label">Recordarme</label>
                            </div>
                            <a href="#" id="forgotPassword">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                    </form>

                    <p class="text-center mt-4">
                        ¿No tienes cuenta?
                        <a href="#" id="showRegister">Regístrate</a>
                    </p>
                </section>

                <!-- REGISTRO -->
                <section id="registerSection" hidden>
                    <h1 class="h3 text-center">Crear cuenta</h1>
                    <p class="text-center text-muted">Únete a la comunidad LostIT</p>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerName" class="form-label">Nombre completo</label>
                            <input type="text" id="registerName" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">Correo electrónico</label>
                            <input type="email" id="registerEmail" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">Contraseña</label>
                            <input type="password" id="registerPassword" class="form-control" minlength="8" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                            <input type="password" id="confirmPassword" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                    </form>

                    <p class="text-center mt-4">
                        ¿Ya tienes cuenta?
                        <a href="#" id="showLogin">Inicia sesión</a>
                    </p>
                </section>

            </div>
        </div>
    </div>
</main>

<script src="js/auth.js"></script>
</body>
</html>
